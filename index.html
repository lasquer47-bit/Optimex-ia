<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const DEF={anthropic:'claude-sonnet-4-6',openai:'gpt-4o-mini',gemini:'gemini-2.0-flash'};
let cfg={p:'anthropic',m:DEF.anthropic,k:''};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('optimex')||'{}'))}catch(e){}
let hist=[],speak=false,busy=false,mode='idle',viaVoice=false;

const SYS=`Eres OPTIMEX IA, una IA conversacional completa estilo JARVIS creada por el desarrollador lasquer47, experta en calibrar sensibilidades de Free Fire (escala 0 a 200). Español, tono elegante y cercano, respuestas cortas (máx. 4 líneas), puedes usar **negritas**.
REGLA CLAVE: responde SIEMPRE a lo que escriba el usuario, sea lo que sea (dudas de Free Fire, qué es DPI o Hz, su celular, saludos, bromas, "?", "no sé", mensajes sueltos, preguntas generales, errores de dedo). Atiende primero su mensaje y luego, si hace falta, retoma la calibración con UNA sola pregunta. Nunca repitas una pregunta con las mismas palabras. Acepta datos en cualquier orden y varios a la vez; si algo no lo sabe, estímalo tú y dilo.
DATOS A OBTENER: 1) marca/modelo (tú aportas resolución, Hz, densidad dpi nativa, pulgadas y muestreo táctil estimados y pides confirmar) y cómo llamarlo; 2) estilo (corta/media/larga distancia); 3) sensibilidad base (baja/media/alta) y dedos (2/3/4 claw); 4) problema actual al disparar. Si pide la sensi ya, genérala con supuestos.
Al tener lo suficiente, di una frase breve tipo "Perfecto: 2 dedos. Listo <apodo>, aquí tienes tu sensi." y AL FINAL un bloque \`\`\`json con exactamente estas claves (un motor local de calibración valida y recalcula los números finales; NO escribas números de sensibilidad en el texto):
{"apodo":"","perfil":"ej: Android gama media · Head Shot · 2 dedos","gama":"baja|media|alta","hz":60,"dpi_nativo":0,"pulgadas":0,"dedos":2,"estilo":"corta|media|larga","base":"baja|media|alta","problema":"ninguno|pasa_cabeza|pegada_pecho|mucha_sensi|lenta|pesada|inestable","general":0,"punto_rojo":0,"mira2x":0,"mira4x":0,"mira_awm":0,"camara_libre":0,"ajustes":{"general":0,"punto_rojo":0,"mira2x":0,"mira4x":0,"mira_awm":0,"camara_libre":0}}
Los valores de sensibilidad son tu estimación 0-200 (general > punto rojo > 2x > 4x > AWM). "ajustes" son correcciones en puntos (-15 a +15) solo cuando el usuario pide afinar (ej. "sube un poco la 4x" => mira4x:4); conserva los parámetros del bloque anterior y cambia solo lo pedido. Aclara brevemente que es un punto de partida a afinar en práctica.`;

/* ===== MOTOR DE CALIBRACIÓN ===== */
const K=['general','punto_rojo','mira2x','mira4x','mira_awm','camara_libre'];
const RAT=[.958,.827,.743,.586,.78]; // proporciones reales por mira tomadas de la referencia (191/183/158/142/112/149)
const PD={ninguno:[0,0,0,0,0,0],pasa_cabeza:[-6,-12,-10,-8,-6,-6],pegada_pecho:[-4,-8,-6,-4,-3,-4],mucha_sensi:[-10,-10,-10,-9,-7,-9],lenta:[8,8,8,6,4,6],pesada:[8,10,8,6,4,6],inestable:[-3,-6,-5,-4,-3,-3]};
function calc(r){
  const B={baja:128,media:158,alta:184},G={baja:6,media:0,alta:-3},hzv=+r.hz||60;
  const base=B[r.base]??158,gama=G[r.gama]??0,hz=hzv>=144?-6:hzv>=120?-4:hzv>=90?0:5,dd={2:4,3:0,4:-4}[+r.dedos]??0,es={corta:5,media:0,larga:-9}[r.estilo]??0,pd=PD[r.problema]||PD.ninguno,ad=r.ajustes||{};
  const g0=base+gama+hz+dd+es,eng=[g0+pd[0],...RAT.map((k,i)=>g0*k+pd[i+1])];
  let v=eng.map((e,i)=>{const a=+r[K[i]];return (a>0?.75*e+.25*a:e)+(+ad[K[i]]||0)}).map(x=>cl(Math.round(x),0,200));
  v[1]=Math.min(v[1],v[0]);v[2]=Math.min(v[2],v[1]);v[3]=Math.min(v[3],v[2]);v[4]=Math.min(v[4],v[3]);v[5]=Math.min(v[5],v[0]);
  const n=+r.dpi_nativo,dpi=n>0?`${n} nativo · rango ${Math.round(n*.95/10)*10}–${Math.round(n*1.07/10)*10}`:(r.dpi||'Mantén el DPI nativo');
  let s={2:62,3:55,4:48}[+r.dedos]??55;if(r.estilo==='corta')s+=3;if(r.estilo==='larga')s-=2;const p=+r.pulgadas;if(p>=6.7)s-=3;else if(p>0&&p<6.2)s+=3;s=cl(s,35,80);
  const known=[r.gama,r.hz,r.dpi_nativo,r.pulgadas,r.dedos,r.estilo,r.base,r.problema].filter(Boolean).length;
  const sg=x=>(x>=0?'+':'')+x;
  return {v,dpi,btn:`${s}% (rango ${s-5}–${s+5}%)`,conf:Math.round(55+known/8*43),
   why:[`Base ${r.base||'media'}: ${base}`,`Gama ${r.gama||'media'}: ${sg(gama)}`,`${hzv} Hz: ${sg(hz)}`,`${r.dedos||3} dedos: ${sg(dd)}`,`Estilo ${r.estilo||'media'}: ${sg(es)}`,`Problema (${r.problema||'ninguno'}): ${sg(pd[0])} general`]};
}

/* ===== ESFERA ===== */
const cv=$('#orb'),cx=cv.getContext('2d');let W=0,H=0,sp=1,col=[255,196,0],tcol=[255,196,0],A=0,rip=[],lastRip=0;
function size(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(size).observe(cv);size();
const PTS=[];for(let i=0;i<320;i++){const y=1-2*(i+.5)/320,r=Math.sqrt(1-y*y),t=i*2.399963;PTS.push([Math.cos(t)*r,y,Math.sin(t)*r])}
function setMode(m){mode=m;const L={idle:['En línea',[255,196,0],1],think:['Procesando',[255,196,0],4],speak:['Respondiendo',[255,196,0],2],listen:['Escuchando',[24,227,255],1.5]}[m];$('#st').textContent=L[0];tcol=L[1];sp=L[2]}
function draw(t){
  cx.clearRect(0,0,W,H);col=col.map((c,i)=>c+(tcol[i]-c)*.08);
  const c=`${col[0]|0},${col[1]|0},${col[2]|0}`,R=Math.min(W,H)*.24,u=W/260;
  const pul=mode==='speak'?Math.sin(t/90)*.06+Math.sin(t/37)*.03:mode==='think'?Math.sin(t/180)*.05:mode==='listen'?Math.sin(t/120)*.04:Math.sin(t/900)*.015,r=R*(1+pul);A+=.006*sp;
  let g=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,r*2.1);g.addColorStop(0,`rgba(${c},.3)`);g.addColorStop(.5,'rgba(138,60,255,.1)');g.addColorStop(1,'transparent');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  if(mode!=='idle'&&t-lastRip>(mode==='think'?900:650)){rip.push(t);lastRip=t}rip=rip.filter(x=>t-x<2000);
  cx.lineWidth=1.2;for(const x of rip){const p=(t-x)/2000;cx.strokeStyle=`rgba(${c},${.55*(1-p)})`;cx.beginPath();cx.arc(W/2,H/2,r*(1.1+p*.9),0,6.283);cx.stroke()}
  cx.lineWidth=1.4;for(let i=0;i<90;i++){const a=i/90*6.283+t/6000*sp,n=Math.abs(Math.sin(t/60+i*1.7)+Math.sin(t/37+i*.9))/2,l=(i%5?2:6)+(mode==='speak'?(.3+n)*13:mode==='listen'?n*9:mode==='think'?n*4:0);cx.strokeStyle=`rgba(${c},${i%5?.35:.8})`;cx.beginPath();cx.moveTo(W/2+Math.cos(a)*r*1.62,H/2+Math.sin(a)*r*1.62);cx.lineTo(W/2+Math.cos(a)*(r*1.62+l*u),H/2+Math.sin(a)*(r*1.62+l*u));cx.stroke()}
  for(const p of PTS){const x=p[0]*Math.cos(A)-p[2]*Math.sin(A),z=p[0]*Math.sin(A)+p[2]*Math.cos(A),y=p[1]*Math.cos(.35)-z*Math.sin(.35),zz=p[1]*Math.sin(.35)+z*Math.cos(.35),k=(zz+1)/2;cx.fillStyle=`rgba(${c},${.12+k*.88})`;cx.beginPath();cx.arc(W/2+x*r,H/2+y*r,(.5+k*1.4)*(W/240),0,6.283);cx.fill()}
  for(let i=0;i<3;i++){const a=t/(2500+i*900)*(i%2?-1:1)*sp,rr=r*(1.2+i*.12);cx.strokeStyle=i==1?'rgba(24,227,255,.6)':`rgba(${c},.55)`;cx.setLineDash(i==2?[3,7]:[]);cx.beginPath();cx.ellipse(W/2,H/2,rr,rr*(.35+.1*i),a+i,0,i==0?4.4:6.283);cx.stroke()}
  cx.setLineDash([]);g=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,r*.5);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.4,`rgba(${c},.65)`);g.addColorStop(1,'transparent');cx.fillStyle=g;cx.beginPath();cx.arc(W/2,H/2,r*.5,0,6.283);cx.fill();
  requestAnimationFrame(draw)}
requestAnimationFrame(draw);

/* ===== VOZ ===== */
let voice=null;function pick(){const v=speechSynthesis.getVoices().filter(x=>/^es/i.test(x.lang));voice=v.find(x=>/google|natural|neural/i.test(x.name))||v.find(x=>/mx|us|419/i.test(x.lang))||v[0]||null}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}
function say(t){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t.replace(/\*\*/g,''));u.lang='es-ES';if(voice)u.voice=voice;u.rate=1;u.pitch=.8;u.onstart=()=>setMode('speak');u.onend=()=>{if(!busy)setMode('idle')};speechSynthesis.cancel();speechSynthesis.speak(u)}

/* ===== CHAT ===== */
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function bubble(t,c=''){const d=document.createElement('div');d.className='m '+c;if(t)d.textContent=t;$('#log').appendChild(d);$('#log').scrollTop=1e9;return d}
async function type(el,t){const p=t.replace(/\*\*/g,''),tn=document.createTextNode(''),cr=document.createElement('span');cr.className='cr';el.textContent='';el.append(tn,cr);el.classList.add('typing');
  const step=p.length>400?3:p.length>200?2:1;for(let i=0;i<p.length;i+=step){tn.data+=p.slice(i,i+step);await sleep(14);$('#log').scrollTop=1e9}
  el.classList.remove('typing');el.innerHTML=fmt(t)}
function fail(r,d){const e=new Error(d.error?.message||('HTTP '+r.status));e.status=r.status;throw e}
const msgs=()=>{const m=hist.slice(-30);while(m.length&&m[0].role!=='user')m.shift();return m};

async function callAI(){
  const {p,m,k}=cfg;if(!k)throw new Error('Falta la API key. Pulsa ⚙ para configurarla.');const M=msgs();let r,d;
  if(p==='anthropic'){r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:m,max_tokens:1600,system:SYS,messages:M})});d=await r.json();if(!r.ok)fail(r,d);return d.content.map(c=>c.text||'').join('')}
  if(p==='openai'){r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+k},body:JSON.stringify({model:m,messages:[{role:'system',content:SYS},...M]})});d=await r.json();if(!r.ok)fail(r,d);return d.choices[0].message.content}
  r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(k)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:M.map(h=>({role:h.role==='user'?'user':'model',parts:[{text:h.content}]}))})});d=await r.json();if(!r.ok)fail(r,d);return d.candidates[0].content.parts.map(x=>x.text||'').join('')}

async function callRetry(el){
  for(let i=0;;i++){try{return await callAI()}catch(e){
    const sat=[429,500,502,503,529].includes(e.status)||/high demand|overload|temporar|fetch/i.test(e.message);
    if(!sat||i>=3)throw e;el.innerHTML='<span class="dots"><i></i><i></i><i></i></span> Servidor saturado, reintentando ('+(i+1)+'/3)...';await sleep(2000*(i+1))}}
}
function send(text){
  text=(text||'').trim();if(busy||!text)return;if(window.speechSynthesis)speechSynthesis.cancel();bubble(text,'u');
  const l=hist[hist.length-1];if(l&&l.role==='user')l.content+='\n'+text;else hist.push({role:'user',content:text});run();
}
function getJSON(out){
  let m=out.match(/```json\s*([\s\S]*?)```/);if(m)return m[1];
  const i=out.search(/\{\s*"apodo"/);if(i<0)return null;let d=0;for(let j=i;j<out.length;j++){if(out[j]==='{')d++;if(out[j]==='}'&&--d===0)return out.slice(i,j+1)}return null}
async function run(){
  if(busy)return;busy=true;setMode('think');if(hist.length>2)$('#orbwrap').classList.add('compact');
  const el=bubble('');el.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
  try{
    const out=await callRetry(el);hist.push({role:'assistant',content:out});
    const js=getJSON(out);let clean=out.replace(/```json[\s\S]*?(```|$)/,'');if(js)clean=clean.replace(js,'');clean=clean.trim();
    const sv=speak||viaVoice;viaVoice=false;setMode('speak');if(sv&&clean)say(clean);
    await type(el,clean||'Configuración lista.');busy=false;if(!sv||!window.speechSynthesis||!speechSynthesis.speaking)setMode('idle');
    if(js){try{hud(JSON.parse(js),true)}catch(e){bubble('No pude leer la configuración. Pídeme que la genere otra vez.','err')}}
  }catch(e){
    el.className='m err';el.innerHTML='';el.append(/high demand|overload/i.test(e.message)?'El servidor de IA está saturado ahora mismo. Tu mensaje no se perdió.':e.message);
    const b=document.createElement('button');b.textContent='⟳ REINTENTAR';b.onclick=()=>{el.remove();run()};el.append(b);setMode('idle')}
  busy=false;
}

/* ===== PANEL ===== */
function cnt(el,to,ms=1400){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
const NAMES=['General','Punto rojo','Mira 2x','Mira 4x','Mira AWM','Cámara libre'];
function hud(r,save){
  const c=calc(r),nick=r.apodo||'Jugador',box=document.createElement('div');box.className='hud';
  box.innerHTML=`<div class="hh"><div class="k">SENSI DE</div><h2></h2><div class="sub"></div><div class="cf">DATOS<b>${c.conf}%</b></div></div>`+
   NAMES.map((n,i)=>`<div class="row ${i?'':'big'}" style="--d:${i*.12}s"><div><span>${n}</span><b>0</b></div><div class="bar"><i data-w="${c.v[i]/2}"></i></div></div>`).join('')+
   `<div class="sys"><h3>AJUSTES <span class="nn"></span></h3><div class="st"><span>DPI</span><b>${esc(String(c.dpi))}</b></div><div class="st"><span>Tamaño del botón de disparo</span><b>${esc(c.btn)}</b></div></div>
   <details><summary>▸ CÓMO SE CALCULÓ</summary><p>${c.why.join('<br>')}<br>Ratios de miras basados en perfil de referencia.</p></details>
   <div class="acts"><button id="cp">COPIAR</button><button id="nw">NUEVA CALIBRACIÓN</button></div>`;
  box.querySelector('h2').textContent=nick;box.querySelector('.sub').textContent=r.perfil||'';box.querySelector('.nn').textContent=nick.toUpperCase();
  $('#log').appendChild(box);$('#log').scrollTop=1e9;
  setTimeout(()=>{box.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%');box.querySelectorAll('.row b').forEach((b,i)=>setTimeout(()=>cnt(b,c.v[i]),i*120))},80);
  const txt=`SENSI DE ${nick} | Optimex IA | Dev: lasquer47\n${r.perfil||''}\n`+NAMES.map((n,i)=>`${n}: ${c.v[i]}`).join('\n')+`\nDPI: ${c.dpi}\nBotón de disparo: ${c.btn}`;
  box.querySelector('#cp').onclick=async e=>{try{await navigator.clipboard.writeText(txt);e.target.textContent='¡COPIADO!'}catch(_){prompt('Copia:',txt)}};
  box.querySelector('#nw').onclick=start;
  if(save){try{const h=JSON.parse(localStorage.getItem('optimex_h')||'[]');h.unshift({t:Date.now(),r,g:c.v[0]});localStorage.setItem('optimex_h',JSON.stringify(h.slice(0,20)))}catch(e){}}
}
function showHist(){
  let h=[];try{h=JSON.parse(localStorage.getItem('optimex_h')||'[]')}catch(e){}
  const l=$('#hl');l.innerHTML=h.length?'':'<div class="n">Aún no hay sensis guardadas. Se guardan solas al generarlas.</div>';
  h.forEach(x=>{const b=document.createElement('button');b.className='hi';b.innerHTML=`<b></b><small></small>`;b.firstChild.textContent=(x.r.apodo||'Jugador')+' · General '+x.g;b.lastChild.textContent=(x.r.perfil||'')+' · '+new Date(x.t).toLocaleDateString();b.onclick=()=>{$('#his').classList.remove('on');hud(x.r,false)};l.appendChild(b)});
  $('#his').classList.add('on');
}

async function start(){
  if(window.speechSynthesis)speechSynthesis.cancel();
  hist=[{role:'user',content:'Inicia la calibración.'}];$('#log').innerHTML='';$('#orbwrap').classList.remove('compact');busy=true;
  const g='Sistema Optimex en línea. Hola lasquer47, por favor ingresa o selecciona tu dispositivo móvil (marca y modelo). También puedes preguntarme lo que quieras.';
  const el=bubble('');setMode('speak');if(speak)say(g);await type(el,g);busy=false;if(!speak)setMode('idle');
  hist.push({role:'assistant',content:g});
}

$('#f').onsubmit=e=>{e.preventDefault();const v=$('#in').value;$('#in').value='';send(v)};
$('#cb').onclick=()=>{$('#prov').value=cfg.p;$('#model').value=cfg.m;$('#key').value=cfg.k;$('#cfg').classList.add('on')};
$('#close').onclick=()=>$('#cfg').classList.remove('on');
$('#prov').onchange=()=>$('#model').value=DEF[$('#prov').value];
$('#save').onclick=()=>{cfg={p:$('#prov').value,m:$('#model').value.trim()||DEF[$('#prov').value],k:$('#key').value.trim()};try{localStorage.setItem('optimex',JSON.stringify(cfg))}catch(e){}$('#cfg').classList.remove('on')};
$('#hb').onclick=showHist;$('#hclose').onclick=()=>$('#his').classList.remove('on');
$('#hclear').onclick=()=>{try{localStorage.removeItem('optimex_h')}catch(e){}showHist()};
$('#vo').onclick=()=>{speak=!speak;$('#vo').textContent=speak?'🔊':'🔇';if(!speak&&window.speechSynthesis){speechSynthesis.cancel();setMode('idle')}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('#mic').onclick=()=>{if(!SR)return alert('Tu navegador no soporta reconocimiento de voz. Prueba con Chrome.');if(window.speechSynthesis)speechSynthesis.cancel();const r=new SR(),b=$('#mic');r.lang='es-ES';
  r.onstart=()=>{setMode('listen');b.classList.add('on')};r.onend=()=>{b.classList.remove('on');if(mode==='listen')setMode('idle')};r.onerror=e=>{b.classList.remove('on');setMode('idle');if(e.error==='not-allowed')alert('Permite el micrófono en el navegador.')};
  r.onresult=e=>{viaVoice=true;send(e.results[0][0].transcript)};try{r.start()}catch(_){}};

(async()=>{
  const b=$('#boot');for(const l of ['> OPTIMEX IA v4.0','> Inicializando núcleo neuronal...','> Cargando motor de calibración...','> Sistema en línea.']){b.textContent+=l+'\n';await sleep(420)}
  b.style.opacity=0;setTimeout(()=>b.remove(),800);start();if(!cfg.k)$('#cb').click();
})();
</script>
</body>
</html>
