<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Optimex IA | Dev: lasquer47</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--amb:#ffb800;--cy:#18e3ff;--pu:#7a3cff;--tx:#e9e4d4;--mut:#8a8575}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{height:100dvh;background:radial-gradient(ellipse at 50% -10%,#1a1230 0,#07070a 55%,#030303);color:var(--tx);font-family:'Share Tech Mono',monospace;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,184,0,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,184,0,.025) 1px,transparent 1px);background-size:36px 36px;mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%)}
header{position:relative;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 6px}
.brand b{font:700 17px Rajdhani;letter-spacing:6px;color:var(--amb)}
.brand small{display:block;font-size:10px;color:var(--mut);letter-spacing:1px}
.ib{background:none;border:1px solid rgba(255,184,0,.35);color:var(--amb);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:15px;margin-left:6px}
.ib:hover{background:rgba(255,184,0,.12)}
#orbwrap{position:relative;display:flex;flex-direction:column;align-items:center;flex:none;transition:.4s}
#orb{width:min(46vw,210px);height:min(46vw,210px)}
#st{font-size:10px;letter-spacing:4px;color:var(--cy);margin-top:-6px;text-transform:uppercase}
main{position:relative;flex:1;display:flex;flex-direction:column;width:100%;max-width:760px;margin:0 auto;min-height:0;padding:8px 14px 0}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 2px 10px;scrollbar-width:none;mask-image:linear-gradient(transparent,#000 14px)}
.m{max-width:88%;font-size:14px;line-height:1.55;white-space:pre-wrap;padding:2px 0 2px 12px;border-left:2px solid var(--amb);color:var(--tx)}
.m.u{align-self:flex-end;border-left:0;border-right:2px solid var(--cy);padding:2px 12px 2px 0;color:var(--cy);text-align:right}
.hud{position:relative;border:1px solid rgba(255,184,0,.3);border-top:2px solid var(--amb);background:linear-gradient(160deg,rgba(18,14,30,.92),rgba(8,8,10,.95));padding:16px;box-shadow:0 0 30px rgba(122,60,255,.18)}
.hud .k{font-size:10px;letter-spacing:5px;color:var(--mut)}
.hud h2{font:700 30px Rajdhani;letter-spacing:2px;color:var(--amb);text-shadow:0 0 14px rgba(255,184,0,.5);text-transform:uppercase}
.hud .sub{font-size:12px;color:var(--tx);opacity:.8;margin-bottom:6px}
.row{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.row div{display:flex;justify-content:space-between;font:500 15px Rajdhani}
.row b{color:var(--amb);font-size:17px}
.bar{height:3px;background:#1b1b20;margin-top:5px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pu),var(--amb));box-shadow:0 0 8px var(--amb);transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.sys{margin-top:12px;font-size:12px;line-height:1.7;color:var(--cy)}
.sys h3{font:700 12px Rajdhani;letter-spacing:3px;color:var(--amb);margin-bottom:4px}
.sys span{color:var(--mut)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts button{flex:1;background:none;color:var(--amb);border:1px solid var(--amb);padding:10px;font:inherit;font-size:12px;cursor:pointer;letter-spacing:1px}
.acts button:hover{background:var(--amb);color:#000}
form{display:flex;align-items:center;gap:8px;margin:6px 0 4px;padding:6px 6px 6px 16px;border:1px solid rgba(255,184,0,.4);border-radius:30px;background:rgba(10,10,14,.85);backdrop-filter:blur(8px)}
form:focus-within{box-shadow:0 0 18px rgba(255,184,0,.3)}
input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:inherit;font-size:14px;padding:8px 0}
input:focus{outline:none}
form button{width:38px;height:38px;border-radius:50%;border:0;background:rgba(24,227,255,.12);color:var(--cy);font-size:16px;cursor:pointer}
form button.go{background:var(--amb);color:#000;font-weight:700}
footer{text-align:center;font-size:10px;color:#666;padding:2px 0 calc(8px + env(safe-area-inset-bottom));letter-spacing:1px}
#cfg{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#cfg.on{display:flex}
#cfg .hud{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
#cfg input,#cfg select{background:#0a0a0c;border:1px solid rgba(255,184,0,.4);color:var(--tx);padding:10px;font:inherit;border-radius:6px;flex:none}
#cfg .n{font-size:11px;color:var(--mut)}
.boot{position:fixed;inset:0;background:#000;z-index:20;display:flex;align-items:center;justify-content:center;color:var(--amb);font-size:13px;transition:opacity .8s;white-space:pre;line-height:1.8}
</style>
</head>
<body>
<div class="boot" id="boot"></div>
<header>
  <div class="brand"><b>OPTIMEX IA</b><small>Optimex IA | Dev: lasquer47</small></div>
  <div><button class="ib" id="vo" title="Voz">🔇</button><button class="ib" id="cb" title="Configuración">⚙</button></div>
</header>
<div id="orbwrap"><canvas id="orb"></canvas><div id="st">En línea</div></div>
<main>
  <div id="log"></div>
  <form id="f"><input id="in" placeholder="Habla con Optimex IA..." autocomplete="off"><button type="button" id="mic">🎤</button><button class="go">➤</button></form>
</main>
<footer>OPTIMEX IA | DEV: LASQUER47</footer>

<div id="cfg"><div class="hud">
  <h2 style="font-size:20px">Núcleo IA</h2>
  <select id="prov"><option value="anthropic">Anthropic (Claude)</option><option value="openai">OpenAI</option><option value="gemini">Google Gemini</option></select>
  <input id="model" placeholder="Modelo">
  <input id="key" type="password" placeholder="Pega tu API key aquí">
  <div class="n">La clave se guarda solo en este navegador (localStorage), nunca en GitHub.</div>
  <div class="acts"><button id="save">GUARDAR</button><button id="close">CERRAR</button></div>
</div></div>

<script>
const $=s=>document.querySelector(s);
const DEF={anthropic:'claude-sonnet-4-6',openai:'gpt-4o-mini',gemini:'gemini-2.0-flash'};
let cfg={p:'anthropic',m:DEF.anthropic,k:''};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('optimex')||'{}'))}catch(e){}
let hist=[],speak=false,busy=false,mode='idle';

const SYS=`Eres OPTIMEX IA, un asistente estilo JARVIS creado por el desarrollador lasquer47, experto en calibrar sensibilidades de Free Fire (valores de 0 a 200). Hablas en español, tono elegante, preciso y tecnológico; mensajes cortos. El usuario conversa libremente contigo (no hay botones), así que guía tú la charla, UNA pregunta a la vez y sin repetir lo que ya te dijo:
1) Marca/modelo del celular. Con tu conocimiento indica resolución, tasa de refresco (Hz), densidad (dpi) y muestreo táctil estimados, aclarando que son estimados y pidiendo confirmar o corregir. Pregunta también cómo quiere que lo llames en el panel (su apodo).
2) Estilo de juego (corta, media o larga distancia).
3) Sensibilidad base (baja, media o alta) y dedos (2, 3 o 4 claw).
4) Problema actual (la mira se pasa de la cabeza, se siente pesada, lenta, etc.).
Si el usuario te pregunta cualquier cosa de sensibilidad, responde y continúa el flujo. Cuando tengas todo, di una frase breve tipo "Perfecto: 2 dedos. Listo <apodo>, aquí tienes tu sensi." y AL FINAL un bloque \`\`\`json con exactamente: {"apodo":"texto","perfil":"ej: Android gama media · Head Shot · 2 dedos","general":n,"punto_rojo":n,"mira2x":n,"mira4x":n,"mira_awm":n,"camara_libre":n,"dpi":"texto","touch":"texto","velocidad":"texto","notas":"texto"} con n entero 0-200 coherente con dispositivo, dedos, estilo y problema. Si pide ajustes, genera un nuevo bloque. Aclara brevemente que es un punto de partida a afinar en práctica.`;

/* ===== ESFERA JARVIS ===== */
const cv=$('#orb'),cx=cv.getContext('2d');let W=0,H=0,sp=1,pul=0,col=[255,184,0],tcol=[255,184,0],A=0;
function size(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);size();
const PTS=[];for(let i=0;i<300;i++){const y=1-2*(i+.5)/300,r=Math.sqrt(1-y*y),t=i*2.399963;PTS.push([Math.cos(t)*r,y,Math.sin(t)*r])}
function setMode(m){mode=m;const L={idle:['En línea',[255,184,0],1],think:['Procesando',[255,184,0],4],speak:['Respondiendo',[255,184,0],2],listen:['Escuchando',[24,227,255],1.5]}[m];$('#st').textContent=L[0];tcol=L[1];sp=L[2]}
function draw(t){
  cx.clearRect(0,0,W,H);col=col.map((c,i)=>c+(tcol[i]-c)*.08);
  const c=`${col[0]|0},${col[1]|0},${col[2]|0}`,R=Math.min(W,H)*.3;
  pul=mode==='speak'?Math.sin(t/90)*.05+Math.sin(t/37)*.03:mode==='think'?Math.sin(t/200)*.04:Math.sin(t/900)*.015;
  const r=R*(1+pul);A+=.006*sp;
  let g=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,r*1.9);g.addColorStop(0,`rgba(${c},.28)`);g.addColorStop(.5,`rgba(122,60,255,.08)`);g.addColorStop(1,'transparent');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  for(const p of PTS){const x=p[0]*Math.cos(A)-p[2]*Math.sin(A),z=p[0]*Math.sin(A)+p[2]*Math.cos(A),y=p[1]*Math.cos(.35)-z*Math.sin(.35),zz=p[1]*Math.sin(.35)+z*Math.cos(.35);const k=(zz+1)/2;cx.fillStyle=`rgba(${c},${.15+k*.85})`;cx.beginPath();cx.arc(W/2+x*r,H/2+y*r,.6+k*1.5,0,6.283);cx.fill()}
  cx.lineWidth=1;for(let i=0;i<3;i++){const a=t/(2500+i*900)*(i%2?-1:1)*sp,rr=r*(1.25+i*.14);cx.strokeStyle=i==1?`rgba(24,227,255,.55)`:`rgba(${c},.5)`;cx.setLineDash(i==2?[3,7]:[]);cx.beginPath();cx.ellipse(W/2,H/2,rr,rr*(.35+.1*i),a+i,0,i==0?4.4:6.283);cx.stroke()}
  cx.setLineDash([]);g=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,r*.45);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.4,`rgba(${c},.6)`);g.addColorStop(1,'transparent');cx.fillStyle=g;cx.beginPath();cx.arc(W/2,H/2,r*.45,0,6.283);cx.fill();
  requestAnimationFrame(draw)}
requestAnimationFrame(draw);

/* ===== CHAT ===== */
function bubble(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('#log').appendChild(d);$('#log').scrollTop=1e9;return d}
async function type(el,t){el.textContent='';for(const ch of t){el.textContent+=ch;if(Math.random()<.4)await new Promise(r=>setTimeout(r,10));$('#log').scrollTop=1e9}}
function say(t){if(!speak||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.onstart=()=>setMode('speak');u.onend=()=>setMode('idle');speechSynthesis.cancel();speechSynthesis.speak(u)}

async function callAI(){
  const {p,m,k}=cfg;if(!k)throw new Error('Falta la API key. Pulsa ⚙ para configurarla.');
  let r,d;
  if(p==='anthropic'){r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:m,max_tokens:1500,system:SYS,messages:hist})});d=await r.json();if(!r.ok)throw new Error(d.error?.message||r.status);return d.content[0].text}
  if(p==='openai'){r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+k},body:JSON.stringify({model:m,messages:[{role:'system',content:SYS},...hist]})});d=await r.json();if(!r.ok)throw new Error(d.error?.message||r.status);return d.choices[0].message.content}
  r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(k)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:hist.map(h=>({role:h.role==='user'?'user':'model',parts:[{text:h.content}]}))})});d=await r.json();if(!r.ok)throw new Error(d.error?.message||r.status);return d.candidates[0].content.parts[0].text}

async function send(text){
  if(busy||!text.trim())return;busy=true;
  bubble(text,'u');hist.push({role:'user',content:text});setMode('think');
  const el=bubble('▮ Procesando...','');
  try{
    const out=await callAI();hist.push({role:'assistant',content:out});
    const mt=out.match(/```json\s*([\s\S]*?)```/),clean=out.replace(/```json[\s\S]*?```/,'').trim();
    setMode('speak');await type(el,clean);say(clean);if(!speak)setMode('idle');
    if(mt){try{hud(JSON.parse(mt[1]))}catch(e){bubble('No pude leer la configuración. Pídeme que la genere otra vez.','')}}
  }catch(e){el.textContent='⚠ Error del sistema: '+e.message;hist.pop();setMode('idle')}
  busy=false;
}

function hud(r){
  const rows=[['General','general'],['Punto rojo','punto_rojo'],['Mira 2x','mira2x'],['Mira 4x','mira4x'],['Mira AWM','mira_awm'],['Cámara libre','camara_libre']];
  const v=x=>Math.max(0,Math.min(200,Math.round(+x||0))),nick=(r.apodo||'Jugador');
  const box=document.createElement('div');box.className='hud';
  box.innerHTML=`<div class="k">SENSI DE</div><h2></h2><div class="sub"></div>`+rows.map(([n,k])=>`<div class="row"><div><span>${n}</span><b>${v(r[k])}</b></div><div class="bar"><i data-w="${v(r[k])/2}"></i></div></div>`).join('')+`<div class="sys"><h3>AJUSTES ${'\u200b'}</h3><span>DPI</span> <b></b><br><span>Registro táctil</span> <b></b><br><span>Velocidad de desplazamiento</span> <b></b><br><span>Notas</span> <b></b></div><div class="acts"><button id="cp">COPIAR CONFIGURACIÓN</button><button id="nw">NUEVA CALIBRACIÓN</button></div>`;
  box.querySelector('h2').textContent=nick;box.querySelector('.sub').textContent=r.perfil||'';
  box.querySelector('h3').textContent='AJUSTES '+nick.toUpperCase();
  const bs=box.querySelectorAll('.sys b');[r.dpi,r.touch,r.velocidad,r.notas].forEach((x,i)=>bs[i].textContent=x||'-');
  $('#log').appendChild(box);$('#log').scrollTop=1e9;
  setTimeout(()=>box.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%'),60);
  const txt=`SENSI DE ${nick} | Optimex IA | Dev: lasquer47\n${r.perfil||''}\n`+rows.map(([n,k])=>`${n}: ${v(r[k])}`).join('\n')+`\nDPI: ${r.dpi}\nRegistro táctil: ${r.touch}\nVelocidad: ${r.velocidad}`;
  box.querySelector('#cp').onclick=async e=>{try{await navigator.clipboard.writeText(txt);e.target.textContent='¡COPIADO!'}catch(_){prompt('Copia:',txt)}};
  box.querySelector('#nw').onclick=start;
}

async function start(){
  hist=[{role:'user',content:'Inicia la calibración.'}];$('#log').innerHTML='';
  const g='Sistema Optimex en línea. Hola lasquer47, por favor ingresa o selecciona tu dispositivo móvil (marca y modelo).';
  const el=bubble('','');setMode('speak');await type(el,g);say(g);if(!speak)setMode('idle');
  hist.push({role:'assistant',content:g});
}

$('#f').onsubmit=e=>{e.preventDefault();const v=$('#in').value;$('#in').value='';send(v)};
$('#cb').onclick=()=>{$('#prov').value=cfg.p;$('#model').value=cfg.m;$('#key').value=cfg.k;$('#cfg').classList.add('on')};
$('#close').onclick=()=>$('#cfg').classList.remove('on');
$('#prov').onchange=()=>$('#model').value=DEF[$('#prov').value];
$('#save').onclick=()=>{cfg={p:$('#prov').value,m:$('#model').value||DEF[$('#prov').value],k:$('#key').value.trim()};try{localStorage.setItem('optimex',JSON.stringify(cfg))}catch(e){}$('#cfg').classList.remove('on')};
$('#vo').onclick=()=>{speak=!speak;$('#vo').textContent=speak?'🔊':'🔇';if(!speak){speechSynthesis.cancel();setMode('idle')}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('#mic').onclick=()=>{if(!SR)return alert('Tu navegador no soporta reconocimiento de voz.');const r=new SR();r.lang='es-ES';r.onstart=()=>setMode('listen');r.onend=()=>{if(mode==='listen')setMode('idle')};r.onresult=e=>send(e.results[0][0].transcript);r.start()};

(async()=>{
  const b=$('#boot');for(const l of ['> OPTIMEX IA v2.0','> Inicializando núcleo...','> Sincronizando módulos de calibración...','> Sistema en línea.']){b.textContent+=l+'\n';await new Promise(r=>setTimeout(r,420))}
  b.style.opacity=0;setTimeout(()=>b.remove(),800);start();if(!cfg.k)$('#cb').click();
})();
</script>
</body>
</html>
