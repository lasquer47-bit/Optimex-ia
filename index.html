<style>

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

body{height:100dvh;background:radial-gradient(900px 460px at 50% -8%,rgba(70,224,216,.07),transparent 65%),var(--bg);color:var(--tx);font:400 15px/1.5 Inter,sans-serif;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 4px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(70,224,216,.6);display:grid;place-items:center;box-shadow:0 0 14px rgba(70,224,216,.25)}
.logo::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--amb);box-shadow:0 0 10px var(--amb)}
.brand b{position:relative;display:block;font:900 14px Orbitron;letter-spacing:4px;color:#fff}
.brand b::before,.brand b::after{content:attr(data-t);position:absolute;left:0;top:0;opacity:0}
.brand b::before{color:#0ff;animation:gl 7s infinite}.brand b::after{color:#f0a;animation:gl 7s infinite .1s}

svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

body.kb #stage,body.kb #bar,body.kb footer{display:none}
#orb{position:absolute;inset:0;width:100%;height:100%}

#mt div{padding:6px 10px;border-right:1px solid var(--line)}#mt div:last-child{border:0}

#chip{position:absolute;top:42px;left:12px;display:flex;align-items:center;gap:7px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);background:rgba(4,6,11,.7);font:8.5px 'Share Tech Mono';letter-spacing:3px;text-transform:uppercase;color:var(--amb)}
#chip i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;animation:bl 1.4s infinite}

@keyframes bl{50%{opacity:.25}}
#bar{flex:none;padding:10px 12px 2px}
#call{width:100%;height:46px;border-radius:14px;border:1px solid rgba(70,224,216,.45);background:linear-gradient(180deg,rgba(70,224,216,.12),rgba(70,224,216,.03));color:var(--tl);font:800 11px Orbitron;letter-spacing:3px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
#call svg{width:16px;height:16px}
body.call #call{border-color:rgba(255,84,112,.6);background:rgba(255,84,112,.1);color:#ff8da0}
#toast{position:fixed;top:calc(58px + env(safe-area-inset-top));left:14px;right:14px;z-index:8;padding:10px 14px;border-radius:12px;background:rgba(30,10,16,.97);border:1px solid rgba(255,84,112,.6);color:#ffb7c2;font:500 13px/1.4 Inter;opacity:0;transform:translateY(-8px);transition:.3s;pointer-events:none}

main{flex:1;display:flex;flex-direction:column;width:100%;max-width:780px;margin:0 auto;min-height:0;padding:0 14px}
.log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:10px 2px;scrollbar-width:none;overscroll-behavior:contain}

.m::before{content:"OPTIMEX";display:block;font:9px 'Share Tech Mono';letter-spacing:3px;color:var(--tl);margin-bottom:4px}

.card .ct{color:var(--tl);letter-spacing:3px;font-size:10px;margin-bottom:6px}
.card .kv{display:grid;grid-template-columns:auto 1fr;gap:1px 14px}.card .kv b{color:var(--tx);font-weight:400;text-align:right}
.card .pg{height:2px;background:rgba(255,255,255,.08);margin-top:9px;overflow:hidden}.card .pg i{display:block;height:100%;width:30%;background:var(--tl);animation:sl 1.1s linear infinite}
@keyframes sl{from{margin-left:-30%}to{margin-left:100%}}
.bk{animation:bl .8s infinite}
.tag{display:inline-block;padding:0 7px;border-radius:8px;border:1px solid;font-size:8.5px;letter-spacing:1px;margin-left:8px}
.tag.ok{color:var(--ok);border-color:rgba(61,220,151,.5)}.tag.es{color:var(--amb);border-color:rgba(255,176,0,.5)}
.hud{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:20px;overflow:hidden;animation:in .5s both}

.hh{padding:16px 18px 12px;border-bottom:1px solid var(--line);position:relative}
.k{font:9px 'Share Tech Mono';letter-spacing:5px;color:var(--mut)}

.cf{position:absolute;right:16px;top:16px;text-align:right;font:9px 'Share Tech Mono';letter-spacing:2px;color:var(--ok)}
.cf b{display:block;font:800 18px Orbitron;letter-spacing:0}
.row{padding:11px 18px 10px;border-bottom:1px solid var(--line);animation:slide .5s both;animation-delay:var(--d)}

.row div{display:flex;justify-content:space-between;align-items:baseline;font:500 15px Inter}

.row.big div{font-size:17px}.row.big b{font-size:22px;color:var(--amb)}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:7px;overflow:hidden}

.sys{padding:14px 18px 4px}
.sys h3{font:800 11px Orbitron;letter-spacing:3px;color:var(--amb);margin-bottom:10px}
.st{margin-bottom:10px}

.acts{display:flex;gap:10px;padding:12px 18px 18px}

.modal.on{display:flex}

.n{font:11px/1.5 'Share Tech Mono';color:var(--mut)}
.mod-acts{display:flex;gap:8px}

.boot button{background:none;border:1px solid var(--ok);color:var(--ok);padding:13px 26px;border-radius:10px;font:800 12px Orbitron;letter-spacing:3px;cursor:pointer;box-shadow:0 0 18px rgba(61,220,151,.3)}

#tabs{flex:none;display:flex;gap:3px;margin:4px 12px 0;padding:3px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03)}
#tabs button{flex:1;height:34px;border:0;border-radius:11px;background:none;color:var(--mut);font:800 10px Orbitron;letter-spacing:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}

/* Markdown seguro (todo se escapa antes de aplicar formato) */
function md(src){
  const blocks=[];let s=src.replace(/```([\w+#.-]*)[^\S\n]*\n?([\s\S]*?)(```|$)/g,(m,l,c)=>{blocks.push([l,c.replace(/\n$/,'')]);return '\u0000'+(blocks.length-1)+'\u0000'});
  s=esc(s);
  const inl=t=>t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*\n]*)\*(?!\*)/g,'$1<i>$2</i>').replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)"]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const L=s.split('\n'),isUl=l=>/^\s*[-*•]\s+/.test(l),isOl=l=>/^\s*\d+[.)]\s+/.test(l),isTb=l=>/^\s*\|.*\|\s*$/.test(l),isCb=l=>/^\u0000\d+\u0000$/.test(l.trim());let o='',i=0,m;
  while(i<L.length){const l=L[i];
    if(isCb(l)){const [lg,c]=blocks[+l.trim().slice(1,-1)];o+='<div class="cb"><div class="ch"><span>'+esc(lg||'código')+'</span><button class="cpb">COPIAR</button></div><pre><code>'+esc(c)+'</code></pre></div>';i++;continue}
    if(m=l.match(/^(#{1,4})\s+(.*)/)){const n=m[1].length+1;o+='<h'+n+'>'+inl(m[2])+'</h'+n+'>';i++;continue}
    if(isUl(l)){let it='';while(i<L.length&&isUl(L[i])){it+='<li>'+inl(L[i].replace(/^\s*[-*•]\s+/,''))+'</li>';i++}o+='<ul>'+it+'</ul>';continue}
    if(isOl(l)){let it='';while(i<L.length&&isOl(L[i])){it+='<li>'+inl(L[i].replace(/^\s*\d+[.)]\s+/,''))+'</li>';i++}o+='<ol>'+it+'</ol>';continue}
    if(/^&gt;\s?/.test(l)){let q=[];while(i<L.length&&/^&gt;\s?/.test(L[i])){q.push(inl(L[i].replace(/^&gt;\s?/,'')));i++}o+='<blockquote>'+q.join('<br>')+'</blockquote>';continue}
    if(isTb(l)&&L[i+1]&&/^\s*\|?[\s:|-]+\|?\s*$/.test(L[i+1])&&/-/.test(L[i+1])){const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(x=>inl(x.trim()));let t='<thead><tr>'+cells(l).map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';i+=2;while(i<L.length&&isTb(L[i])){t+='<tr>'+cells(L[i]).map(x=>'<td>'+x+'</td>').join('')+'</tr>';i++}o+='<div class="tw"><table>'+t+'</tbody></table></div>';continue}
    if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){o+='<hr>';i++;continue}
    if(!l.trim()){i++;continue}
    const pr=[];while(i<L.length&&L[i].trim()&&!isCb(L[i])&&!isUl(L[i])&&!isOl(L[i])&&!/^(#{1,4}\s|&gt;)/.test(L[i])&&!isTb(L[i])){pr.push(L[i]);i++}
    if(!pr.length){o+='<p>'+inl(L[i])+'</p>';i++}else o+='<p>'+pr.map(inl).join('<br>')+'</p>'}
  return o}

    const rd=r.body.getReader(),dec=new TextDecoder();let buf='',txt='',gm=null;

  throw last}

$('#cmds').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='tWeb'){WEB=!WEB;try{localStorage.setItem('optimex_web',WEB?'1':'0')}catch(x){}toast(WEB?'Búsqueda web activada':'Búsqueda web desactivada');applyApp()}
  else if(b.id==='tDeep'){DEEP=!DEEP;try{localStorage.setItem('optimex_deep',DEEP?'1':'0')}catch(x){}toast(DEEP?'Modo OMEGA: máxima profundidad (más lento)':'Modo OMEGA desactivado');applyApp()}
  else if(b.classList.contains('nw')){if(!busy){ATT=null;renderAtt();startGen()}}
  else{const i=$('#in');i.value=b.textContent+' '+i.value.replace(/^\/\w+\s*/,'');i.focus()}};
$('#logG').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('cpb')){const t=b.closest('.cb').querySelector('code').textContent;navigator.clipboard.writeText(t).then(()=>{b.textContent='¡COPIADO!';setTimeout(()=>b.textContent='COPIAR',1500)}).catch(()=>prompt('Copia:',t))}
  else if(b.classList.contains('mcp')){const m=b.closest('.m'),t=m._raw||m.textContent;navigator.clipboard.writeText(t).then(()=>{b.textContent='¡COPIADO!';setTimeout(()=>b.textContent='COPIAR',1500)}).catch(()=>prompt('Copia:',t))}
  else if(b.classList.contains('rg')&&!busy){const m=b.closest('.m');if(hist.length&&hist[hist.length-1].role==='assistant')hist.pop();m.remove();runGen()}};
$('#atb').onclick=()=>$('#fi').click();$('#fi').onchange=e=>{pickFile(e.target.files[0]);e.target.value=''};

async function start(){
  stopSpeech();DEV=null;devName='';scanP=null;LASTCAL=null;hist=[{role:'user',content:'Inicia la calibración.'}];LG().innerHTML='';busy=true;
  const g='Sistema Optimex en línea. Hola lasquer47, dime tu celular, marca y modelo. También puedes preguntarme lo que quieras.';
  const el=bubble(''),S=speak?say(g):null;setMode('speak');await type(el,g);hist.push({role:'assistant',content:g});busy=false;if(S)await S.done;if(!speaking&&!callOn)setMode('idle')}

$('#f').onsubmit=e=>{e.preventDefault();const v=$('#in').value;$('#in').value='';send(v)};
$('#in').onfocus=()=>document.body.classList.add('kb');$('#in').onblur=()=>setTimeout(()=>document.body.classList.remove('kb'),150);
$('#cb').onclick=()=>{$('#prov').value=cfg.p;$('#model').value=cfg.m;$('#key').value=cfg.k;$('#voice').value=cfg.v||'Charon';$('#cfg').classList.add('on')};
$('#close').onclick=()=>$('#cfg').classList.remove('on');
$('#prov').onchange=()=>$('#model').value=DEF[$('#prov').value];
const saveCfg=()=>{cfg={p:$('#prov').value,m:$('#model').value.trim()||DEF[$('#prov').value],k:$('#key').value.trim(),v:$('#voice').value};try{localStorage.setItem('optimex',JSON.stringify(cfg))}catch(e){}ttsWarned=false;if(PROXY){cfg.p='gemini';cfg.k=''}};
$('#save').onclick=()=>{saveCfg();$('#cfg').classList.remove('on')};
$('#tv').onclick=()=>{saveCfg();AC();stopSpeech();say('Sistema Optimex en línea. Así sonará mi voz durante la calibración.')};
$('#hb').onclick=showHist;$('#hclose').onclick=()=>$('#his').classList.remove('on');
$('#hclear').onclick=()=>{try{localStorage.removeItem('optimex_h')}catch(e){}showHist()};
$('#vo').onclick=()=>{speak=!speak;$('#vo').innerHTML=speak?ICO.vol:ICO.mute;if(!speak){stopSpeech();setMode('idle')}};
$('#mic').onclick=micBtn;$('#call').onclick=callToggle;$('#call2').onclick=callToggle;

const ICO={
vol:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg>',
mute:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
hist:'<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.4"/><path d="M3 4v4h4M12 7v5l3 2"/></svg>',
gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
mic:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
send:'<svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7-7-1z"/></svg>',
clip:'<svg viewBox="0 0 24 24"><path d="M21 11l-8.5 8.5a5 5 0 01-7-7L14 4a3.5 3.5 0 015 5l-8.6 8.6a2 2 0 01-3-3L15 7"/></svg>',
phone:'<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg>'};
(async()=>{
  const set=(q,h)=>{const e=$(q);if(e)e.innerHTML=h};
  set('#vo',ICO.vol);set('#hb',ICO.hist);set('#cb',ICO.gear);set('#mic',ICO.mic);set('form button.go',ICO.send);set('#atb',ICO.clip);set('#call',ICO.phone+'INICIAR LLAMADA');set('#call2',ICO.phone+'LLAMAR');
  if(PROXY){['prov','model','key'].forEach(i=>$('#'+i).style.display='none');$('#knote').textContent='Elige la voz de Optimex IA.'}
  const T0=Date.now();setInterval(()=>{const s=((Date.now()-T0)/1000)|0;$('#tUp').textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);tele();
  const b=$('#bt'),pb=$('#pbi'),L=['kernel optimex v9.0','núcleo neuronal','motor de calibración experto','búsqueda de dispositivos','módulo JARVIS ∞ (IA general)','enlace seguro (proxy)'];
  for(let i=0;i<L.length;i++){b.innerHTML+='[ <u>OK</u> ] '+L[i]+'\n';pb.style.width=((i+1)/L.length*100)+'%';await sleep(330)}
  b.innerHTML+='> sistema en línea<span class="bk">_</span>';$('#go').hidden=false;
  $('#go').onclick=()=>{AC();if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}
    $('#boot').style.opacity=0;setTimeout(()=>$('#boot').remove(),700);initApp();if(!PROXY&&!cfg.k)$('#cb').click();discover()};
})();
</script>
</body>
