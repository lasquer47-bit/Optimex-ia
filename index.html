const SYS=`Eres OPTIMEX IA, una IA conversacional completa estilo JARVIS creada por el desarrollador lasquer47, experta en calibrar sensibilidades de Free Fire (escala 0 a 200). Si te preguntan quién te creó, menciona a lasquer47 con naturalidad, sin exagerar elogios. Español, tono elegante y cercano. Tus respuestas se leen en voz alta como en una llamada: frases naturales y cortas (máx. 3 líneas), sin emojis ni listas; puedes usar **negritas**. Si el usuario habla por voz puede haber errores de transcripción: interprétalos con criterio.
REGLA CLAVE: responde SIEMPRE a lo que escriba o diga el usuario, sea lo que sea (dudas de Free Fire, qué es DPI o Hz, su celular, saludos, bromas, "?", "no sé", mensajes sueltos, preguntas generales). Atiende primero su mensaje y luego, si hace falta, retoma la calibración con UNA sola pregunta. Nunca repitas una pregunta con las mismas palabras. Acepta datos en cualquier orden y varios a la vez; si algo no lo sabe, estímalo tú y dilo.
DATOS A OBTENER: 1) marca/modelo (tú aportas resolución, Hz, densidad dpi nativa, pulgadas y muestreo táctil estimados y pides confirmar) y cómo llamarlo; 2) estilo (corta/media/larga distancia); 3) sensibilidad base (baja/media/alta) y dedos (2/3/4 claw); 4) problema actual al disparar. Si pide la sensi ya, genérala con supuestos.

{"apodo":"","perfil":"ej: Android gama media · Head Shot · 2 dedos","gama":"baja|media|alta","hz":60,"dpi_nativo":0,"pulgadas":0,"dedos":2,"estilo":"corta|media|larga","base":"baja|media|alta","problema":"ninguno|pasa_cabeza|pegada_pecho|mucha_sensi|lenta|pesada|inestable","general":0,"punto_rojo":0,"mira2x":0,"mira4x":0,"mira_awm":0,"camara_libre":0,"ajustes":{"general":0,"punto_rojo":0,"mira2x":0,"mira4x":0,"mira_awm":0,"camara_libre":0}}

/* ===== MOTOR DE CALIBRACIÓN ===== */
const K=['general','punto_rojo','mira2x','mira4x','mira_awm','camara_libre'];
const RAT=[.958,.827,.743,.586,.78];
const PD={ninguno:[0,0,0,0,0,0],pasa_cabeza:[-6,-12,-10,-8,-6,-6],pegada_pecho:[-4,-8,-6,-4,-3,-4],mucha_sensi:[-10,-10,-10,-9,-7,-9],lenta:[8,8,8,6,4,6],pesada:[8,10,8,6,4,6],inestable:[-3,-6,-5,-4,-3,-3]};

  const B={baja:128,media:158,alta:184},G={baja:6,media:0,alta:-3},hzv=+r.hz||60;

  const g0=base+gama+hz+dd+es,eng=[g0+pd[0],...RAT.map((k,i)=>g0*k+pd[i+1])];
  let v=eng.map((e,i)=>{const a=+r[K[i]];return (a>0?.75*e+.25*a:e)+(+ad[K[i]]||0)}).map(x=>cl(Math.round(x),0,200));
  v[1]=Math.min(v[1],v[0]);v[2]=Math.min(v[2],v[1]);v[3]=Math.min(v[3],v[2]);v[4]=Math.min(v[4],v[3]);v[5]=Math.min(v[5],v[0]);
  const n=+r.dpi_nativo,dpi=n>0?`${n} nativo · rango ${Math.round(n*.95/10)*10}–${Math.round(n*1.07/10)*10}`:(r.dpi||'Mantén el DPI nativo');
  let s={2:62,3:55,4:48}[+r.dedos]??55;if(r.estilo==='corta')s+=3;if(r.estilo==='larga')s-=2;const p=+r.pulgadas;if(p>=6.7)s-=3;else if(p>0&&p<6.2)s+=3;s=cl(s,35,80);
  const known=[r.gama,r.hz,r.dpi_nativo,r.pulgadas,r.dedos,r.estilo,r.base,r.problema].filter(Boolean).length,sg=x=>(x>=0?'+':'')+x;
  return {v,dpi,btn:`${s}% (rango ${s-5}–${s+5}%)`,conf:Math.round(55+known/8*43),
   why:[`Base ${r.base||'media'}: ${base}`,`Gama ${r.gama||'media'}: ${sg(gama)}`,`${hzv} Hz: ${sg(hz)}`,`${r.dedos||3} dedos: ${sg(dd)}`,`Estilo ${r.estilo||'media'}: ${sg(es)}`,`Problema (${r.problema||'ninguno'}): ${sg(pd[0])} general`]};
}

const cv=$('#orb'),cx=cv.getContext('2d');let W=0,H=0,needSize=true,sp=1,col=[255,184,0],tcol=[255,184,0],A0=0,lv=0,ob=null;const wv=new Float32Array(44);

async function run(){
  if(busy)return;busy=true;setMode('think');
  const el=bubble('');el.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';let S=null;
  try{
    const out=await callRetry(el);hist.push({role:'assistant',content:out});
    const js=getJSON(out);let clean=out.replace(/```json[\s\S]*?(```|$)/,'');if(js)clean=clean.replace(js,'');clean=clean.trim();
    if((speak||callOn)&&clean)S=say(clean);
    setMode('speak');await type(el,clean||'Configuración lista.');busy=false;
    if(js){try{hud(JSON.parse(js),true)}catch(e){bubble('No pude leer la configuración. Pídeme que la genere otra vez.','err')}}
    if(S)await S.done;
  }catch(e){
    el.className='m err';el.innerHTML='';el.append((e.status>=500||e.status===408||/tard|high demand|overload|saturad/i.test(e.message))?'La IA está tardando o saturada ahora mismo. Tu mensaje no se perdió: toca reintentar.':e.message);
    const b=document.createElement('button');b.textContent='⟳ REINTENTAR';b.onclick=()=>{el.remove();run()};el.append(b)}
  busy=false;if(!callOn&&!speaking)setMode('idle');
}

/* ===== PANEL ===== */
function cnt(el,to,ms=1300){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
const NAMES=['General','Punto rojo','Mira 2x','Mira 4x','Mira AWM','Cámara libre'];
function hud(r,save){
  const c=calc(r),nick=r.apodo||'Jugador',box=document.createElement('div');box.className='hud';
  box.innerHTML=`<div class="hh"><div class="k">SENSI DE</div><h2></h2><div class="sub"></div><div class="cf">DATOS<b>${c.conf}%</b></div></div>`+
   NAMES.map((n,i)=>`<div class="row ${i?'':'big'}" style="--d:${i*.1}s"><div><span>${n}</span><b>0</b></div><div class="bar"><i data-w="${c.v[i]/2}"></i></div></div>`).join('')+
   `<div class="sys"><h3>AJUSTES <span class="nn"></span></h3><div class="st"><span>DPI</span><b>${esc(String(c.dpi))}</b></div><div class="st"><span>Tamaño del botón de disparo</span><b>${esc(c.btn)}</b></div></div>
   <details><summary>▸ CÓMO SE CALCULÓ</summary><p>${c.why.join('<br>')}<br>Ratios de miras basados en perfil de referencia.</p></details>
   <div class="acts"><button id="cp">COPIAR</button><button id="nw">NUEVA CALIBRACIÓN</button></div>`;
  box.querySelector('h2').textContent=nick;box.querySelector('.sub').textContent=r.perfil||'';box.querySelector('.nn').textContent=nick.toUpperCase();
  $('#log').appendChild(box);down();
  setTimeout(()=>{box.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%');box.querySelectorAll('.row b').forEach((b,i)=>setTimeout(()=>cnt(b,c.v[i]),i*100))},80);
  const txt=`SENSI DE ${nick} | Optimex IA | Dev: lasquer47\n${r.perfil||''}\n`+NAMES.map((n,i)=>`${n}: ${c.v[i]}`).join('\n')+`\nDPI: ${c.dpi}\nBotón de disparo: ${c.btn}`;
  box.querySelector('#cp').onclick=async e=>{try{await navigator.clipboard.writeText(txt);e.target.textContent='¡COPIADO!'}catch(_){prompt('Copia:',txt)}};
  box.querySelector('#nw').onclick=start;
  if(save){try{const h=JSON.parse(localStorage.getItem('optimex_h')||'[]');h.unshift({t:Date.now(),r,g:c.v[0]});localStorage.setItem('optimex_h',JSON.stringify(h.slice(0,20)))}catch(e){}}
}
function showHist(){
  let h=[];try{h=JSON.parse(localStorage.getItem('optimex_h')||'[]')}catch(e){}
  const l=$('#hl');l.innerHTML=h.length?'':'<div class="n">Aún no hay sensis guardadas. Se guardan solas al generarlas.</div>';
  h.forEach(x=>{const b=document.createElement('button');b.className='hi';b.innerHTML='<b></b><small></small>';b.firstChild.textContent=(x.r.apodo||'Jugador')+' · General '+x.g;b.lastChild.textContent=(x.r.perfil||'')+' · '+new Date(x.t).toLocaleDateString();b.onclick=()=>{$('#his').classList.remove('on');hud(x.r,false)};l.appendChild(b)});
  $('#his').classList.add('on')}

async function start(){
  stopSpeech();hist=[{role:'user',content:'Inicia la calibración.'}];$('#log').innerHTML='';busy=true;
  const g='Sistema Optimex en línea. Hola lasquer47, por favor dime tu dispositivo móvil, marca y modelo. También puedes preguntarme lo que quieras.';
  const el=bubble(''),S=speak?say(g):null;setMode('speak');await type(el,g);hist.push({role:'assistant',content:g});busy=false;if(S)await S.done;if(!speaking&&!callOn)setMode('idle')}

$('#f').onsubmit=e=>{e.preventDefault();const v=$('#in').value;$('#in').value='';send(v)};
$('#in').onfocus=()=>document.body.classList.add('kb');$('#in').onblur=()=>setTimeout(()=>document.body.classList.remove('kb'),150);
$('#cb').onclick=()=>{$('#prov').value=cfg.p;$('#model').value=cfg.m;$('#key').value=cfg.k;$('#voice').value=cfg.v||'Charon';$('#cfg').classList.add('on')};
$('#close').onclick=()=>$('#cfg').classList.remove('on');
$('#prov').onchange=()=>$('#model').value=DEF[$('#prov').value];
const saveCfg=()=>{cfg={p:$('#prov').value,m:$('#model').value.trim()||DEF[$('#prov').value],k:$('#key').value.trim(),v:$('#voice').value};try{localStorage.setItem('optimex',JSON.stringify(cfg))}catch(e){}ttsWarned=false;if(PROXY){cfg.p='gemini';cfg.k=''}};
$('#save').onclick=()=>{saveCfg();$('#cfg').classList.remove('on')};
$('#tv').onclick=()=>{saveCfg();AC();stopSpeech();say('Sistema Optimex en línea. Así sonará mi voz durante la calibración.')};
$('#hb').onclick=showHist;$('#hclose').onclick=()=>$('#his').classList.remove('on');
$('#hclear').onclick=()=>{try{localStorage.removeItem('optimex_h')}catch(e){}showHist()};
$('#vo').onclick=()=>{speak=!speak;$('#vo').innerHTML=speak?ICO.vol:ICO.mute;if(!speak){stopSpeech();setMode('idle')}tele()};
$('#mic').onclick=micBtn;$('#call').onclick=callToggle;

const ICO={
vol:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg>',
mute:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
hist:'<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.4"/><path d="M3 4v4h4M12 7v5l3 2"/></svg>',
gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
mic:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
send:'<svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7-7-1z"/></svg>',
phone:'<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg>'};
(async()=>{
  const set=(q,h)=>{const e=$(q);if(e)e.innerHTML=h};
  set('#vo',ICO.vol);set('#hb',ICO.hist);set('#cb',ICO.gear);set('#mic',ICO.mic);set('form button.go',ICO.send);set('#call',ICO.phone+'INICIAR LLAMADA');
  if(PROXY){['prov','model','key'].forEach(i=>$('#'+i).style.display='none');$('#knote').textContent='Elige la voz de Optimex IA.'}
  const T0=Date.now();setInterval(()=>{const s=((Date.now()-T0)/1000)|0;$('#tUp').textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);tele();
  const b=$('#bt'),pb=$('#pbi'),L=['> OPTIMEX IA v7.2','> Inicializando núcleo neuronal...','> Cargando motor de calibración...','> Enlazando módulo de voz...','> Sistema en línea.'];
  for(let i=0;i<L.length;i++){b.textContent+=L[i]+'\n';pb.style.width=((i+1)/L.length*100)+'%';await sleep(340)}
  $('#go').hidden=false;
  $('#go').onclick=()=>{AC();if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}
    $('#boot').style.opacity=0;setTimeout(()=>$('#boot').remove(),700);start();if(!PROXY&&!cfg.k)$('#cb').click();discover()};
})();
</script>
